# Render Blueprint: runs the FastAPI backend. Blueprint Path in Render = render.yaml
# Secrets marked "sync: false" are entered in the Render dashboard (never committed).
services:
  - type: web
    name: sitecheck-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /layers
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      # Your GitHub Pages address, e.g. https://maanyas.github.io (no trailing slash)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
