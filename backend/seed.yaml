# Seed data loaded into the SQLite database (data/sitecheck.db). Layers, eGRID and prices are re-synced
# from this file on every server start; changing a layer's url/where re-downloads it.
#
# layers:
#   scope: "site"   -> fetched around each screened site, cached in the DB
#          "region" -> fetched once for the whole US (context layers, map overlays)
#   states: ["*"] = everywhere, or a list of state codes
#   out_fields: attributes to download (default: just label_field for site layers)
# egrid: EPA eGRID2023 rev2 summary Table 1, CO2 output emission rate (lb/MWh) per subregion.
# power_prices: EIA avgprice_annual.xlsx, 2020 industrial average (cents/kWh).
# estimate_params: VERIFY against LBNL 2024 US Data Center Energy Usage Report.

layers:
- name: fema_flood
  title: FEMA flood hazard zone (100-yr)
  url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
  where: SFHA_TF = 'T'
  label_field: FLD_ZONE
  states:
  - '*'
  scope: site
  color: '#2563eb'
- name: nwi_wetlands
  title: USFWS National Wetlands Inventory
  url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
  where: 1=1
  label_field: WETLAND_TYPE
  states:
  - '*'
  scope: site
  color: '#059669'
- name: nj_wetlands
  title: NJDEP freshwater wetlands (2012)
  url: https://mapsdep.nj.gov/arcgis/rest/services/Features/Land_lu/MapServer/2
  where: 1=1
  label_field: LABEL12
  states:
  - NJ
  scope: site
  color: '#10b981'
- name: nj_open_space
  title: NJ state, local and nonprofit open space
  url: https://services1.arcgis.com/QWdNfRs7lkPq4g4Q/arcgis/rest/services/Open_Space/FeatureServer/66
  where: 1=1
  label_field: NAME_LABEL
  states:
  - NJ
  scope: site
  color: '#65a30d'
- name: ny_wetlands
  title: NYSDEC regulated freshwater wetlands
  url: https://gisservices.dec.ny.gov/arcgis/rest/services/Wetlands/MapServer/0
  where: 1=1
  label_field: CLASS
  states:
  - NY
  scope: site
  color: '#0d9488'
- name: protected_areas
  title: USGS PAD-US protected areas
  url: https://services.arcgis.com/v01gqwM5QqNysAAi/ArcGIS/rest/services/Fee_Managers_PADUS/FeatureServer/0
  where: 1=1
  label_field: Unit_Nm
  states:
  - '*'
  scope: site
  color: '#84cc16'
- name: critical_habitat
  title: USFWS critical habitat
  url: https://services.arcgis.com/QVENGdaPbd4LUkLV/ArcGIS/rest/services/USFWS_Critical_Habitat/FeatureServer/0
  where: 1=1
  label_field: comname
  states:
  - '*'
  scope: site
  color: '#dc2626'
- name: nj_highlands
  title: NJ Highlands Preservation Area
  label_field: REGION
  states:
  - NJ
  color: '#a16207'
  url: https://services6.arcgis.com/ZrVlS0wslq8Nvq5I/arcgis/rest/services/Preservation_and_Planning_Area/FeatureServer/1
  where: REGION = 'Highlands Preservation Area'
  scope: site
- name: nj_pinelands
  title: NJ Pinelands Area
  label_field: JURISDICTION
  states:
  - NJ
  color: '#15803d'
  url: https://services1.arcgis.com/nCm6SZaiGMuGX35l/arcgis/rest/services/Pinelands_Protection_Act_1979/FeatureServer/0
  where: 1=1
  scope: site
- name: nj_cafra
  title: NJ CAFRA coastal zone
  label_field: COAST_PA
  states:
  - NJ
  color: '#0891b2'
  url: https://mapsdep.nj.gov/arcgis/rest/services/Features/Land_CAFRA_coast/MapServer/2
  where: 1=1
  scope: site
- name: ny_protected
  title: NY Protected Areas Database (NYPAD)
  label_field: Unit_Nm
  states:
  - NY
  color: '#4d7c0f'
  url: https://services6.arcgis.com/DZHaqZm9cxOD4CWM/arcgis/rest/services/NYPAD_view/FeatureServer/0
  where: 1=1
  scope: site
- name: de_wetlands
  title: Delaware wetlands (2017, DNREC)
  label_field: ATTRIBUTE
  states:
  - DE
  color: '#047857'
  url: https://enterprise.firstmap.delaware.gov/arcgis/rest/services/Hydrology/DE_Wetlands/FeatureServer/6
  where: 1=1
  scope: site
- name: water_stress
  title: Baseline water stress (WRI Aqueduct 4.0)
  url: https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/aqueduct_water_risk/FeatureServer/1
  where: gid_0 = 'USA'
  label_field: bws_label
  states:
  - '*'
  scope: region
  color: '#0284c7'
  out_fields: bws_cat,bws_label,bws_score
- name: climate_risk
  title: FEMA National Risk Index (county)
  url: https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Counties/FeatureServer/0
  where: 1=1
  label_field: RISK_RATNG
  states:
  - '*'
  scope: region
  color: '#9333ea'
  out_fields: COUNTY,STATEABBRV,RISK_RATNG,RISK_SCORE,SOVI_RATNG,RESL_RATNG
- name: counties
  title: US Census counties
  url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1
  where: 1=1
  label_field: NAME
  states:
  - '*'
  scope: region
  color: '#6b7280'
  out_fields: NAME,STATE,GEOID
- name: egrid_subregions
  title: EPA eGRID2023 subregions
  label_field: Subregion
  states:
  - '*'
  color: '#64748b'
  url: https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services/eGRID2023_Subregions/FeatureServer/0
  where: 1=1
  scope: region
  out_fields: Subregion
estimate_params:
- key: load_factor
  low: 0.5
  high: 0.8
  source: Assumed average IT utilization of planned MW (team assumption)
- key: pue
  low: 1.15
  high: 1.5
  source: LBNL 2024 US Data Center Energy Usage Report - PUE range (verify)
- key: wue_l_per_kwh
  low: 0.2
  high: 1.0
  source: LBNL 2024 US Data Center Energy Usage Report - on-site water use per IT kWh (verify)
