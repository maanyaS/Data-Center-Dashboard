# Seed data loaded into the SQLite database (data/sitecheck.db) on first run.
# Edit this file, then delete data/sitecheck.db (or run `python -m scripts.reset_db`) to reload.

# GIS layers to screen against.
#   scope: "site"   -> fetched around each screened site (6 km box), cached in the DB
#          "region" -> fetched once for all of NJ + NY (small layers only)
#   url: ArcGIS REST layer URL (".../MapServer/<id>" or ".../FeatureServer/<id>").
#        Leave "" if unknown yet -> findings for that layer say "unknown".
#   label_field: attribute shown in finding text.
layers:
  - name: fema_flood
    title: FEMA flood hazard zone (100-yr)
    url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
    where: "SFHA_TF = 'T'"
    label_field: FLD_ZONE
    states: [NJ, NY, DE]
    scope: site
    color: "#2563eb"
  - name: nwi_wetlands
    title: USFWS National Wetlands Inventory
    url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
    where: "1=1"
    label_field: WETLAND_TYPE
    states: [NJ, NY, DE]
    scope: site
    color: "#059669"
  - name: nj_wetlands
    title: NJDEP freshwater wetlands (2012)
    url: https://mapsdep.nj.gov/arcgis/rest/services/Features/Land_lu/MapServer/2
    where: "1=1"
    label_field: LABEL12
    states: [NJ]
    scope: site
    color: "#10b981"
  - name: nj_open_space
    title: NJ state protected open space
    url: https://mapsdep.nj.gov/arcgis/rest/services/Applications/DEP_NLT/MapServer/1
    where: "1=1"
    label_field: FEATURE_NAME
    states: [NJ]
    scope: site
    color: "#65a30d"
  - name: ny_wetlands
    title: NYSDEC regulated freshwater wetlands
    url: https://gisservices.dec.ny.gov/arcgis/rest/services/Wetlands/MapServer/0
    where: "1=1"
    label_field: CLASS
    states: [NY]
    scope: site
    color: "#0d9488"
  - name: protected_areas
    title: USGS PAD-US protected areas
    url: https://services.arcgis.com/v01gqwM5QqNysAAi/ArcGIS/rest/services/Fee_Managers_PADUS/FeatureServer/0  # PAD-US 4.1 fee lands only
    where: "1=1"
    label_field: Unit_Nm
    states: [NJ, NY, DE]
    scope: site
    color: "#84cc16"
  - name: critical_habitat
    title: USFWS critical habitat
    url: https://services.arcgis.com/QVENGdaPbd4LUkLV/ArcGIS/rest/services/USFWS_Critical_Habitat/FeatureServer/0  # final; proposed = /2
    where: "1=1"
    label_field: comname
    states: [NJ, NY, DE]
    scope: site
    color: "#dc2626"
  # Region-wide context layers: looked up at the pin + shown as map overlays.
  - name: water_stress
    title: Baseline water stress (WRI Aqueduct 4.0)
    url: https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/aqueduct_water_risk/FeatureServer/1
    where: "1=1"
    label_field: bws_label
    states: [NJ, NY, DE]
    scope: region
    color: "#0284c7"
  - name: climate_risk
    title: FEMA National Risk Index (county)
    url: https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Counties/FeatureServer/0
    where: "STATEABBRV IN ('NJ','NY','DE')"
    label_field: RISK_RATNG
    states: [NJ, NY, DE]
    scope: region
    color: "#9333ea"
  # Not screened; used to find which state/county a point is in (and county centroids for alerts).
  - name: counties
    title: US Census counties
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1
    where: "STATE IN ('34','36','10')"
    label_field: NAME
    states: [NJ, NY, DE]
    scope: region
    color: "#6b7280"

# Demand estimate assumptions. VERIFY against LBNL 2024 US Data Center Energy Usage Report.
estimate_params:
  - key: load_factor
    low: 0.5
    high: 0.8
    source: "Assumed average IT utilization of planned MW (team assumption)"
  - key: pue
    low: 1.15
    high: 1.5
    source: "LBNL 2024 US Data Center Energy Usage Report - PUE range (verify)"
  - key: wue_l_per_kwh
    low: 0.2
    high: 1.0
    source: "LBNL 2024 US Data Center Energy Usage Report - on-site water use per IT kWh (verify)"

# Grid region per state/county ("*" = rest of state): carbon rate + industrial power price.
# CO2: EPA eGRID2023 rev2 summary Table 1 (lb CO2 per MWh output). Price: EIA avgprice_annual.xlsx, 2020 industrial.
grid:
  - {state: NJ, county: "*", egrid: RFCE, egrid_name: "RFC East", co2_lb_per_mwh: 596.904, price_cents_kwh: 10.01}
  - {state: DE, county: "*", egrid: RFCE, egrid_name: "RFC East", co2_lb_per_mwh: 596.904, price_cents_kwh: 6.7}
  - {state: NY, county: "*", egrid: NYUP, egrid_name: "NPCC Upstate NY", co2_lb_per_mwh: 242.089, price_cents_kwh: 5.54}
  - {state: NY, county: "Bronx", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "Kings", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "New York", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "Queens", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "Richmond", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "Westchester", egrid: NYCW, egrid_name: "NPCC NYC/Westchester", co2_lb_per_mwh: 864.469, price_cents_kwh: 5.54}
  - {state: NY, county: "Nassau", egrid: NYLI, egrid_name: "NPCC Long Island", co2_lb_per_mwh: 1180.672, price_cents_kwh: 5.54}
  - {state: NY, county: "Suffolk", egrid: NYLI, egrid_name: "NPCC Long Island", co2_lb_per_mwh: 1180.672, price_cents_kwh: 5.54}
